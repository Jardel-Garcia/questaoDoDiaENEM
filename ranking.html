<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ranking — Questão do Dia ENEM</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="board">
    <div class="board__top">
      <img src="assets/logo-eepah.png" alt="Logo EEPAH" class="board__logo">
      <span class="board__brand">E.E. Pe. Augusto Horta<br>Paraopeba — MG</span>
    </div>
    <p class="board__eyebrow">RANKING GERAL</p>
    <h1 class="board__title">Quem mais acerta a Questão do Dia</h1>
    <p class="board__meta">Todas as turmas do 3º ano · acumulado desde o início</p>
  </header>

  <main class="page">
    <div class="wrap">
      <div id="appRanking">
        <div class="loading">Carregando ranking…</div>
      </div>

      <h2 class="section-title">Questões anteriores</h2>
      <div id="appHistorico">
        <div class="loading">Carregando histórico…</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <img src="assets/logo-eepah.png" alt="Logo EEPAH" class="site-footer__logo">
    <p class="credito">Desenvolvido por: <a href="https://www.linkedin.com/in/jardel-garcia-34228261/" target="_blank" rel="noopener">Jardel Garcia</a><br>Escola Estadual Padre Augusto Horta — Paraopeba/MG</p>
  </footer>

<script src="js/config.js"></script>
<script>
const appRanking = document.getElementById("appRanking");
const appHistorico = document.getElementById("appHistorico");
const INTERVALO_ATUALIZACAO = 45000; // 45s — bom para telão/mural

carregarRanking();
carregarHistorico(); // não entra no setInterval: histórico muda no máx. 1x/dia
setInterval(carregarRanking, INTERVALO_ATUALIZACAO);

async function carregarRanking() {
  try {
    const ranking = await apiGet("ranking");
    renderRanking(ranking);
  } catch (e) {
    // Em modo telão, evitamos substituir a tela por um erro feio a cada 45s.
    // Só mostramos erro se ainda não há nada na tela.
    if (!appRanking.querySelector(".ranking-list")) {
      appRanking.innerHTML = `<div class="center-note">Não foi possível carregar o ranking agora. Atualizando automaticamente…</div>`;
    }
  }
}

function renderRanking(lista) {
  if (!lista.length) {
    appRanking.innerHTML = `<div class="center-note">Ainda não há acertos registrados hoje. Seja o primeiro! 🚀</div>`;
    return;
  }

  appRanking.innerHTML = `
    <div class="ranking-list">
      ${lista.map(item => `
        <div class="ranking-row ${item.posicao <= 3 ? `ranking-row--top${item.posicao}` : ""}">
          <span class="ranking-row__pos">${item.posicao}º</span>
          <span class="ranking-row__nome">${escapeHtml(item.nome)}</span>
          <span class="ranking-row__pontos">${item.acertos} ${item.acertos === 1 ? "acerto" : "acertos"}</span>
        </div>
      `).join("")}
    </div>
    <p class="ranking-updated">Atualizado às ${new Date().toLocaleTimeString("pt-BR")}</p>
  `;
}

async function carregarHistorico() {
  try {
    const historico = await apiGet("historicoQuestoes");
    renderHistorico(historico);
  } catch (e) {
    appHistorico.innerHTML = `<div class="center-note">Não foi possível carregar as questões anteriores agora. Detalhe técnico: ${escapeHtml(e.message)}</div>`;
  }
}

function renderHistorico(lista) {
  if (!lista.length) {
    appHistorico.innerHTML = `<div class="center-note" style="padding:20px 0;">Ainda não há questões de dias anteriores.</div>`;
    return;
  }

  appHistorico.innerHTML = `
    <div class="historico-list">
      ${lista.map(q => `
        <details class="historico-item">
          <summary class="historico-item__resumo">
            <span class="historico-item__texto">
              <span class="historico-item__data">${formatarDataBR(q.data)}</span>
              <span class="historico-item__sub">Questão ${q.numero ? escapeHtml(String(q.numero)) : "s/nº"} · ENEM ${escapeHtml(String(q.ano || ""))} · Gabarito <strong>${escapeHtml(q.correta || "")}</strong></span>
            </span>
          </summary>
          <div class="historico-item__corpo">
            <span class="question__disciplina">${escapeHtml(q.disciplina || "ENEM")}</span>
            <div class="question__enunciado">${formatarTexto(q.enunciado)}</div>
            ${q.imagemUrl ? `<img class="question__imagem" src="${q.imagemUrl}" alt="Imagem da questão">` : ""}
            <div class="alternativas">
              ${q.alternativas.map(a => `
                <div class="alt ${a.letra === q.correta ? "is-correct" : ""}">
                  <span class="alt__letra">${a.letra}</span>
                  <span>${formatarTexto(a.texto)}</span>
                </div>
              `).join("")}
            </div>
            ${q.explicacao ? `<div class="explicacao"><strong>Explicação:</strong> ${formatarTexto(q.explicacao)}</div>` : ""}
          </div>
        </details>
      `).join("")}
    </div>
  `;
}

function formatarDataBR(dataIso) {
  const [ano, mes, dia] = String(dataIso).split("-");
  if (!ano || !mes || !dia) return dataIso;
  return `${dia}/${mes}/${ano}`;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// As questões vêm com **negrito** estilo Markdown; converte para <strong>
// depois de escapar o HTML (segurança primeiro, formatação depois).
function formatarTexto(str) {
  return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
</script>
</body>
</html>
